[package]
name = "prisma-app"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "Prisma desktop shell (Tauri): hosts the engine and the patch editor."

# Standalone workspace so this crate resolves independently of the main workspace,
# which deliberately excludes it (it needs desktop system libs CI lacks). See
# app/README.md.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine assembly — the shell's whole reason to exist. Owned for the life of
# the process, shut down in order on exit.
prisma-engine = { path = "../crates/prisma-engine" }
prisma-editor = { path = "../crates/prisma-editor" }
prisma-patch = { path = "../crates/prisma-patch" }
prisma-render = { path = "../crates/prisma-render" }
# The live preview streams from the engine to the in-webview React viewer over a
# local WebSocket (M6's PreviewSink + wire format; S10 adds the React component).
prisma-preview = { path = "../crates/prisma-preview" }
tauri = { version = "2", features = [] }
# Native open/save file dialogs for .prismap (§9). The frontend picks the path;
# the Rust command does the file I/O and (de)serialization.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `serde` so Vec<Uuid> command arguments deserialize from the webview.
uuid = { version = "1", features = ["v4", "serde"] }
# Vec3 for the drag-move translate delta.
glam = "0.29"
