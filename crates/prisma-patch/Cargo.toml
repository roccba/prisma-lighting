[package]
name = "prisma-patch"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Leaf crate: pure data model + serialization + derived runtime indices.
# No dependency on prisma-render or prisma-output — the patch must be testable
# headlessly (CLAUDE.md §7). The compilation to a wire OutputPlan lives in
# prisma-output (which depends on this crate), not here.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
glam = { version = "0.29", features = ["serde"] }

[dev-dependencies]
